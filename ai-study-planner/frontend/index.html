<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="AI Study Planner builds, tracks and automatically adjusts your exam study schedule." />
    <meta name="theme-color" content="#2F44E8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AI Study Planner — plan smarter, study better</title>
    <script>
      try {
        var t = localStorage.getItem("asp_theme");
        if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) document.documentElement.classList.add("dark");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
